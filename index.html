<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aquarium Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hồ cá -->
    <div id="aquarium">
        <img class="fish" id="fish1" src="images/ca1.png">
        <img class="fish" id="fish2" src="images/ca2.png">
        <img class="fish" id="fish3" src="images/ca3.png">
        <img class="fish" id="fish4" src="images/ca4.png">
    </div>

    <!-- Điều khiển -->
    <div class="controls">
        <button id="btnBg">Đổi nền</button>
        <button id="btnMusic">Đổi nhạc</button>
    </div>

    <audio id="musicPlayer" autoplay loop></audio>

    <script src="animation.js"></script>
</body>
</html>
